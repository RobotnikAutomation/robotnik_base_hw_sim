controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    robotnik_base_control:
      type: diff_drive_controller/DiffDriveController
    robotnik_io_controller:
      type: robotnik_io_controller/RobotnikIOController

robotnik_base_control:
  ros__parameters:
    left_wheel_names:
      - front_left_wheel_joint
      - rear_left_wheel_joint
    right_wheel_names:
      - front_right_wheel_joint
      - rear_right_wheel_joint
    wheel_separation: 0.72
    wheel_radius: 0.133
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: -1.0
    odom_frame_id: odom
    base_frame_id: base_link
    cmd_vel_timeout: 0.1
    use_stamped_vel: false
    publish_rate: 50.0
    linear:
      x:
        has_velocity_limits: true
        max_velocity: 2.5
        has_acceleration_limits: true
        max_acceleration: 5.0
        has_jerk_limits: false
        max_jerk: 0.0
    angular:
      z:
        has_velocity_limits: true
        max_velocity: 3.0
        has_acceleration_limits: true
        max_acceleration: 2.5
        has_jerk_limits: false
        max_jerk: 0.0

robotnik_io_controller:
  ros__parameters:
    wheel_names:
    - front_left_wheel_joint
    - rear_left_wheel_joint
    - front_right_wheel_joint
    - rear_right_wheel_joint
    digital_inputs:
    - 5
    - 5
    - 5
    - 5
    digital_outputs:
    - 3
    - 3
    - 3
    - 3
    analog_inputs:
    - 1
    - 1
    - 1
    - 1
    analog_outputs:
    - 0
    - 0
    - 0
    - 0
    analog_inputs_multiplier:
    - 14.64
    - 1.0
    - 1.0
    - 1.0
#   analog_outputs_multiplier:
#   - 1.0
